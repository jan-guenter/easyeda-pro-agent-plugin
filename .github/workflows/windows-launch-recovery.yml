name: Windows launch recovery

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-powershell-recovery:
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Observe the parent PowerShell without launching EasyEDA
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          if ($PSVersionTable.PSEdition -cne 'Desktop' -or
              $PSVersionTable.PSVersion.Major -ne 5 -or
              $PSVersionTable.PSVersion.Minor -ne 1) {
            throw 'This smoke requires Windows PowerShell 5.1.'
          }
          $executable = Join-Path $PSHOME 'powershell.exe'
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\ordinary-launch-recovery.ps1'
          $bytes = [IO.File]::ReadAllBytes($script)
          if ($bytes.Length -ne 2320) { throw 'Recovery helper byte count differs from the reviewed pin.' }
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try { $digest = ([BitConverter]::ToString($sha256.ComputeHash($bytes))).Replace('-', '').ToLowerInvariant() }
          finally { $sha256.Dispose() }
          if ($digest -cne '8ffb025cdd20c1851c37d57a20816240928c7e6425b44528a623c8b8f72a37aa') {
            throw 'Recovery helper bytes differ from the reviewed pin.'
          }
          $decoder = [Text.UTF8Encoding]::new($false, $true)
          $source = $decoder.GetString($bytes)
          $encoded = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($source))
          # Use raw redirected pipes: PowerShell's native-command invocation
          # can deserialize CLIXML progress instead of exposing stderr bytes.
          # The waiting parent guarantees a second powershell process, and
          # the child executes the verified bytes, not a later path reopen.
          $child = [Diagnostics.Process]::new()
          $child.StartInfo.FileName = $executable
          $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -EncodedCommand ' + $encoded
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          $stdoutBuffer = [IO.MemoryStream]::new()
          $stderrBuffer = [IO.MemoryStream]::new()
          $deadline = [Diagnostics.Stopwatch]::StartNew()
          try {
            if (-not $child.Start()) { throw 'Recovery helper did not start.' }
            # Drain both pipes concurrently before waiting for exit.
            $stdoutTask = $child.StandardOutput.BaseStream.CopyToAsync($stdoutBuffer)
            $stderrTask = $child.StandardError.BaseStream.CopyToAsync($stderrBuffer)
            $remaining = 10000 - [int]$deadline.ElapsedMilliseconds
            if ($remaining -le 0 -or -not $child.WaitForExit($remaining)) {
              throw 'Recovery helper exceeded its observation deadline.'
            }
            $remaining = 10000 - [int]$deadline.ElapsedMilliseconds
            if ($remaining -le 0 -or -not [Threading.Tasks.Task]::WaitAll(
                [Threading.Tasks.Task[]]@($stdoutTask, $stderrTask), $remaining)) {
              throw 'Recovery helper output exceeded its observation deadline.'
            }
            $childExitCode = $child.ExitCode
            $stdoutBytes = $stdoutBuffer.ToArray()
            $stderrByteCount = $stderrBuffer.Length
          } finally {
            $deadline.Stop()
            # Dispose closes local handles; it does not terminate the child.
            $child.Dispose()
            $stdoutBuffer.Dispose()
            $stderrBuffer.Dispose()
          }
          if ($stderrByteCount -ne 0) { throw 'Recovery helper emitted unexpected stderr.' }
          if ($childExitCode -ne 0) { throw "Recovery helper exited with code $childExitCode." }
          $stdout = $decoder.GetString($stdoutBytes)
          if ($stdoutBytes.Length -gt 4096 -or $stdout -cnotmatch '\A[^\r\n]+\r?\n\z') {
            throw 'Recovery helper did not emit exactly one JSON line.'
          }
          $result = ConvertFrom-Json -InputObject $stdout
          $keys = @($result.PSObject.Properties.Name | Sort-Object)
          if (($keys -join ',') -cne 'otherPowerShellPresent,sameNameProcessPresent,samples,schema' -or
              $result.schema -cne 'easyeda-pro-control.ordinary-launch-recovery-observation.v1' -or
              ($result.samples -isnot [int] -and $result.samples -isnot [long]) -or
              $result.samples -ne 2 -or
              $result.otherPowerShellPresent -isnot [bool] -or
              $result.sameNameProcessPresent -isnot [bool]) {
            throw 'Recovery helper output does not match its strict observation schema.'
          }
          if (-not $result.otherPowerShellPresent) { throw 'The helper missed its waiting PowerShell parent.' }
          if ($result.sameNameProcessPresent) { throw 'Unexpected EasyEDA process on the fresh hosted runner.' }
          Write-Output 'Windows PowerShell 5.1 recovery helper emitted no stderr, observed its parent and no EasyEDA process.'
          exit 0

      - name: Check fixture directory parsing on Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          & (Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\check-managed-fixture-library-parser.ps1')

      - name: Compile fixture destination and read-only data helpers without allocation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          foreach ($name in @('managed-fixture-destination.ps1', 'closed-generated-fixture-data.ps1')) {
            $script = Join-Path $env:GITHUB_WORKSPACE ('plugins\easyeda-pro-control\scripts\' + $name)
            $child = [Diagnostics.Process]::new()
            $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
            $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -CompileOnly'
            $child.StartInfo.UseShellExecute = $false
            $child.StartInfo.CreateNoWindow = $true
            $child.StartInfo.RedirectStandardOutput = $true
            $child.StartInfo.RedirectStandardError = $true
            try {
              if (-not $child.Start()) { throw ('Fixture compilation helper did not start: ' + $name) }
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(30000)) { throw ('Fixture compilation helper timed out: ' + $name) }
              if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout, $stderr), 5000)) { throw ('Fixture compilation output did not close: ' + $name) }
              if ($child.ExitCode -ne 0 -or $stdout.Result.Length -ne 0 -or $stderr.Result.Length -ne 0) {
                throw ('Fixture compilation refused: ' + $name + ' exit=' + $child.ExitCode + ' stderr=' + $stderr.Result.Substring(0, [Math]::Min(4096, $stderr.Result.Length)))
              }
            } finally { $child.Dispose() }
          }
          Write-Output 'Fixture helpers compiled without directory/watch allocation, application launch or SQL.'

      - name: Check independent Wire request budgets using managed doubles
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $source = Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\schematic-wire-budget-regression.cs') -Raw
          $parameters = New-Object System.CodeDom.Compiler.CompilerParameters
          $parameters.GenerateInMemory = $true
          $parameters.WarningLevel = 4
          $parameters.TreatWarningsAsErrors = $true
          $parameters.CompilerOptions = '/langversion:5'
          Add-Type -TypeDefinition $source -CompilerParameters $parameters
          [EasyedaWireNativeBudgetRegression]::Main()

      - name: Compile each fixed owner purpose and check empty Job and pipe inheritance
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\pcb-diagnostic-owner.ps1'
          foreach ($purpose in @('', '-StringPrecreate', '-WorkerStartup', '-Layers209', '-Spatial209', '-Visual209', '-WorkerStartup209', '-WorkerStartupEmpty209', '-WorkerStartupRatline209', '-WorkerStartupRatlineContinuation209', '-WorkerStartupFootprint209', '-WorkerStartupFootprintCopy209', '-WorkerStartupFootprintSaved209', '-WorkerStartupFootprintMain209', '-WorkerStartupFootprintCombined209')) {
          $child = [Diagnostics.Process]::new()
          $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
          $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -CompileOnly ' + $purpose
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          try {
            if (-not $child.Start()) { throw 'Diagnostic compilation helper did not start.' }
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            if (-not $child.WaitForExit(30000)) { throw 'Diagnostic compilation helper timed out.' }
            if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout, $stderr), 5000)) {
              throw 'Diagnostic compilation helper output did not close.'
            }
            if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0) {
              throw ('Diagnostic compilation failed. Exit=' + $child.ExitCode + ' stderr=' + $stderr.Result)
            }
            if ($stdout.Result.Length -gt 4096 -or $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {
              throw 'Diagnostic compilation helper emitted an invalid output shape.'
            }
            $result = $stdout.Result | ConvertFrom-Json
            if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'compiled,emptyJob,pipesChecked,processLaunched,schema' -or
                $result.schema -cne 'easyeda-pro-control.pcb-diagnostic-compile.v1' -or
                $result.compiled -cne $true -or $result.emptyJob -cne $true -or
                $result.pipesChecked -cne $true -or $result.processLaunched -cne $false) {
              throw 'Diagnostic compilation helper did not prove the empty native construction.'
            }
          } finally { $child.Dispose() }
          }
          Write-Output 'Diagnostic helper compiled and checked an empty Job plus four anonymous pipe endpoints; no application launched.'

      - name: Compile each isolated schematic helper purpose without an application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\schematic-edit-native.ps1'
          foreach ($purpose in @('-SchematicRelevanceDisplayWrite209', '-SchematicWireEdit209')) {
            # This includes cold C# compilation and inert self-checks, independently
            # of the live helper's unchanged launch, RPC and native-owner limits.
            $compileWatch = [Diagnostics.Stopwatch]::StartNew()
            Write-Output ('Schematic compile/self-check start: ' + $purpose)
            $child = [Diagnostics.Process]::new()
            $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
            $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -CompileOnly ' + $purpose
            $child.StartInfo.UseShellExecute = $false
            $child.StartInfo.CreateNoWindow = $true
            $child.StartInfo.RedirectStandardOutput = $true
            $child.StartInfo.RedirectStandardError = $true
            try {
              if (-not $child.Start()) {throw 'Schematic compilation helper did not start.'}
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(30000)) {throw ('Schematic compilation/self-check timed out: ' + $purpose)}
              if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout, $stderr), 5000)) {throw 'Schematic compilation output did not close.'}
              if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0) {throw ('Schematic compilation failed: ' + $stderr.Result)}
              if ($stdout.Result.Length -gt 4096 -or $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {throw 'Schematic compilation output shape refused.'}
              $result = $stdout.Result | ConvertFrom-Json
              if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'compiled,emptyJob,pipesChecked,processLaunched,schema' -or $result.schema -cne 'easyeda-pro-control.schematic-edit-compile.v1' -or $result.compiled -cne $true -or $result.emptyJob -cne $true -or $result.pipesChecked -cne $true -or $result.processLaunched -cne $false) {throw 'Schematic empty construction proof refused.'}
              Write-Output ('Schematic compile/self-check completed: ' + $purpose + ' elapsedMs=' + $compileWatch.ElapsedMilliseconds)
            } finally {$compileWatch.Stop(); $child.Dispose()}
          }

      - name: Compile the isolated saved schematic reader helper without an application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\schematic-saved-readback-native.ps1'
          foreach ($purpose in @('-SchematicRelevanceSavedReadback209')) {
            $child = [Diagnostics.Process]::new()
            $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
            $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -CompileOnly ' + $purpose
            $child.StartInfo.UseShellExecute = $false
            $child.StartInfo.CreateNoWindow = $true
            $child.StartInfo.RedirectStandardOutput = $true
            $child.StartInfo.RedirectStandardError = $true
            try {
              if (-not $child.Start()) {throw 'Schematic compilation helper did not start.'}
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(30000)) {throw 'Schematic compilation helper timed out.'}
              if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout, $stderr), 5000)) {throw 'Schematic compilation output did not close.'}
              if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0) {throw ('Schematic compilation failed: ' + $stderr.Result)}
              if ($stdout.Result.Length -gt 4096 -or $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {throw 'Schematic compilation output shape refused.'}
              $result = $stdout.Result | ConvertFrom-Json
              if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'compiled,emptyJob,pipesChecked,processLaunched,schema' -or $result.schema -cne 'easyeda-pro-control.schematic-saved-readback-compile.v1' -or $result.compiled -cne $true -or $result.emptyJob -cne $true -or $result.pipesChecked -cne $true -or $result.processLaunched -cne $false) {throw 'Schematic empty construction proof refused.'}
            } finally {$child.Dispose()}
          }

      - name: Compile the isolated footprint inverse helper without an application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\footprint-inverse-native.ps1'
          foreach ($purpose in @('-FootprintInverse209')) {
            $child = [Diagnostics.Process]::new()
            $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
            $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -CompileOnly ' + $purpose
            $child.StartInfo.UseShellExecute = $false
            $child.StartInfo.CreateNoWindow = $true
            $child.StartInfo.RedirectStandardOutput = $true
            $child.StartInfo.RedirectStandardError = $true
            try {
              if (-not $child.Start()) {throw 'Footprint inverse compilation helper did not start.'}
              $stdout = $child.StandardOutput.ReadToEndAsync()
              $stderr = $child.StandardError.ReadToEndAsync()
              if (-not $child.WaitForExit(30000)) {throw 'Footprint inverse compilation helper timed out.'}
              if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout, $stderr), 5000)) {throw 'Footprint inverse compilation output did not close.'}
              if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0) {throw ('Footprint inverse compilation failed: ' + $stderr.Result)}
              if ($stdout.Result.Length -gt 4096 -or $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {throw 'Footprint inverse compilation output shape refused.'}
              $result = $stdout.Result | ConvertFrom-Json
              if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'compiled,emptyJob,pipesChecked,processLaunched,schema' -or $result.schema -cne 'easyeda-pro-control.footprint-inverse-compile.v1' -or $result.compiled -cne $true -or $result.emptyJob -cne $true -or $result.pipesChecked -cne $true -or $result.processLaunched -cne $false) {throw 'Footprint inverse empty construction proof refused.'}
            } finally {$child.Dispose()}
          }

      - name: Compile the separate fixed forward-execution graph without an application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\footprint-forward-execution-smoke.ps1'
          $child = [Diagnostics.Process]::new()
          $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
          $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '"'
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          $stdout = $null
          $stderr = $null
          $started = $false
          # Fixed bounded excerpts identify child failures without flooding CI.
          function Write-ForwardGraphFailure([string]$stage) {
            $out = if ($null -ne $stdout -and $stdout.Status -eq [Threading.Tasks.TaskStatus]::RanToCompletion) {$stdout.Result} else {$null}
            $err = if ($null -ne $stderr -and $stderr.Status -eq [Threading.Tasks.TaskStatus]::RanToCompletion) {$stderr.Result} else {$null}
            $exitCode = if ($started -and $child.HasExited) {$child.ExitCode} else {$null}
            $diagnostic = @{
              stage=$stage; exitCode=$exitCode; childExited=($started -and $child.HasExited)
              stdoutChars=$(if ($null -ne $out) {$out.Length} else {$null})
              stderrChars=$(if ($null -ne $err) {$err.Length} else {$null})
              stdoutPrefix=$(if ($null -ne $out) {$out.Substring(0,[Math]::Min(4096,$out.Length))} else {$null})
              stderrPrefix=$(if ($null -ne $err) {$err.Substring(0,[Math]::Min(8192,$err.Length))} else {$null})
            }
            Write-Output ('Forward graph child diagnostic ' + ($diagnostic | ConvertTo-Json -Compress))
          }
          try {
            if (-not $child.Start()) {Write-ForwardGraphFailure 'start'; throw 'Forward graph smoke did not start.'}
            $started = $true
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            if (-not $child.WaitForExit(30000)) {Write-ForwardGraphFailure 'exit-deadline'; throw 'Forward graph smoke did not exit.'}
            if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout,$stderr),5000)) {Write-ForwardGraphFailure 'output-deadline'; throw 'Forward graph smoke output did not close.'}
            if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0 -or $stdout.Result.Length -gt 4096 -or $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {Write-ForwardGraphFailure 'child-result'; throw 'Forward graph smoke failed.'}
            try {$result = $stdout.Result | ConvertFrom-Json} catch {Write-ForwardGraphFailure 'json-output'; throw}
            if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'compiled,emptyJob,executionAuthorized,pipesChecked,processLaunched,schema' -or $result.schema -cne 'easyeda-pro-control.footprint-forward-execution-compile.v2' -or $result.compiled -cne $true -or $result.emptyJob -cne $true -or $result.pipesChecked -cne $true -or $result.processLaunched -cne $false -or $result.executionAuthorized -cne $false) {Write-ForwardGraphFailure 'output-schema'; throw 'Forward graph smoke output refused.'}
          } finally {$child.Dispose()}

      - name: Compile the separate cold forward graph without an application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\footprint-forward-cold-execution-smoke.ps1'
          $child = [Diagnostics.Process]::new()
          $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
          $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '"'
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          $stdout = $null
          $stderr = $null
          $started = $false
          # Fixed bounded excerpts identify child failures without flooding CI.
          function Write-ColdForwardGraphFailure([string]$stage) {
            $out = if ($null -ne $stdout -and $stdout.Status -eq [Threading.Tasks.TaskStatus]::RanToCompletion) {$stdout.Result} else {$null}
            $err = if ($null -ne $stderr -and $stderr.Status -eq [Threading.Tasks.TaskStatus]::RanToCompletion) {$stderr.Result} else {$null}
            $exitCode = if ($started -and $child.HasExited) {$child.ExitCode} else {$null}
            $diagnostic = @{
              stage=$stage; exitCode=$exitCode; childExited=($started -and $child.HasExited)
              stdoutChars=$(if ($null -ne $out) {$out.Length} else {$null})
              stderrChars=$(if ($null -ne $err) {$err.Length} else {$null})
              stdoutPrefix=$(if ($null -ne $out) {$out.Substring(0,[Math]::Min(4096,$out.Length))} else {$null})
              stderrPrefix=$(if ($null -ne $err) {$err.Substring(0,[Math]::Min(8192,$err.Length))} else {$null})
            }
            Write-Output ('Forward graph child diagnostic ' + ($diagnostic | ConvertTo-Json -Compress))
          }
          try {
            if (-not $child.Start()) {Write-ColdForwardGraphFailure 'start'; throw 'Forward graph smoke did not start.'}
            $started = $true
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            if (-not $child.WaitForExit(30000)) {Write-ColdForwardGraphFailure 'exit-deadline'; throw 'Forward graph smoke did not exit.'}
            if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout,$stderr),5000)) {Write-ColdForwardGraphFailure 'output-deadline'; throw 'Forward graph smoke output did not close.'}
            if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0 -or $stdout.Result.Length -gt 4096 -or $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {Write-ColdForwardGraphFailure 'child-result'; throw 'Forward graph smoke failed.'}
            try {$result = $stdout.Result | ConvertFrom-Json} catch {Write-ColdForwardGraphFailure 'json-output'; throw}
            if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'compiled,emptyJob,executionAuthorized,pipesChecked,processLaunched,schema' -or $result.schema -cne 'easyeda-pro-control.footprint-forward-cold-execution-compile.v1' -or $result.compiled -cne $true -or $result.emptyJob -cne $true -or $result.pipesChecked -cne $true -or $result.processLaunched -cne $false -or $result.executionAuthorized -cne $false) {Write-ColdForwardGraphFailure 'output-schema'; throw 'Forward graph smoke output refused.'}
          } finally {$child.Dispose()}

      - name: Verify combined readiness and empty-input closure without an application
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\pcb-diagnostic-owner.ps1'
          $challenge = [Guid]::NewGuid().ToString('N')
          $child = [Diagnostics.Process]::new()
          $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
          $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -WorkerStartupFootprintCombined209 -CombinedReadyChallenge ' + $challenge
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardInput = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          $started = $false
          try {
            if (-not $child.Start()) { throw 'Combined readiness helper did not start.' }
            $started = $true
            [char[]]$stderrBuffer = New-Object char[] 65537
            $stderr = $child.StandardError.ReadAsync($stderrBuffer, 0, $stderrBuffer.Length)
            $clock = [Diagnostics.Stopwatch]::StartNew()
            $line = New-Object Text.StringBuilder
            [char[]]$character = New-Object char[] 1
            while ($true) {
              $remaining = 15000 - $clock.ElapsedMilliseconds
              if ($remaining -le 0) { throw 'Combined readiness helper timed out.' }
              $read = $child.StandardOutput.ReadAsync($character, 0, 1)
              if (-not $read.Wait([int]$remaining) -or $read.Result -ne 1) { throw 'Combined readiness reply did not arrive.' }
              if ($character[0] -eq [char]10) { break }
              if ($line.Length -ge 511) { throw 'Combined readiness reply exceeded its fixed bound.' }
              [void]$line.Append($character[0])
            }
            if ([Text.Encoding]::UTF8.GetByteCount($line.ToString()) -gt 512) { throw 'Combined readiness byte bound exceeded.' }
            $result = $line.ToString() | ConvertFrom-Json
            if ((@($result.PSObject.Properties.Name | Sort-Object) -join ',') -cne 'challenge,creationState,emptyJob,helperInstance,jobId,pipesChecked,processCreated,schema' -or
                $result.schema -cne 'easyeda-pro-control.footprint-combined-ready.v1' -or
                $result.challenge -isnot [string] -or $result.challenge -cne $challenge -or
                $result.creationState -cne 'not-entered' -or $result.helperInstance -isnot [string] -or $result.jobId -isnot [string] -or
                $result.helperInstance -cnotmatch '^[a-f0-9]{32}$' -or $result.jobId -cnotmatch '^[a-f0-9]{32}$' -or
                $result.emptyJob -isnot [bool] -or -not $result.emptyJob -or $result.pipesChecked -isnot [bool] -or -not $result.pipesChecked -or
                $result.processCreated -isnot [bool] -or $result.processCreated) { throw 'Combined readiness packet differs.' }
            # No input byte was written; close only this original empty input.
            $child.StandardInput.Close()
            if (-not $child.WaitForExit(15000)) { throw 'Combined empty-input helper did not exit.' }
            if (-not $stderr.Wait(5000) -or $stderr.Result -ne 0 -or $child.ExitCode -ne 0 -or $child.StandardOutput.Read() -ne -1) {
              throw 'Combined empty-input closure emitted an error or extra output.'
            }
          } finally {
            if ($started) { $child.StandardInput.Close() }
            $child.Dispose()
          }
          Write-Output 'Combined original readiness passed and empty input closed without an application launch.'

      - name: Verify suspended image admission with a fresh no-op child
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $script = Join-Path $env:GITHUB_WORKSPACE 'plugins\easyeda-pro-control\scripts\pcb-diagnostic-launch-smoke.ps1'
          $child = [Diagnostics.Process]::new()
          $child.StartInfo.FileName = Join-Path $PSHOME 'powershell.exe'
          $child.StartInfo.Arguments = '-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "' + $script + '" -ConfirmSyntheticChildLaunch -VerifiedImageProbe'
          $child.StartInfo.UseShellExecute = $false
          $child.StartInfo.CreateNoWindow = $true
          $child.StartInfo.RedirectStandardOutput = $true
          $child.StartInfo.RedirectStandardError = $true
          try {
            if (-not $child.Start()) { throw 'Synthetic image helper did not start.' }
            $stdout = $child.StandardOutput.ReadToEndAsync()
            $stderr = $child.StandardError.ReadToEndAsync()
            if (-not $child.WaitForExit(30000)) { throw 'Synthetic image helper timed out; no forced termination requested.' }
            if (-not [Threading.Tasks.Task]::WaitAll([Threading.Tasks.Task[]]@($stdout, $stderr), 5000)) {
              throw 'Synthetic image output did not close.'
            }
            if ($child.ExitCode -ne 0 -or $stderr.Result.Length -ne 0 -or $stdout.Result.Length -gt 4096 -or
                $stdout.Result -cnotmatch '\A[^\r\n]+\r?\n\z') {
              throw 'Synthetic image helper failed or emitted unexpected output.'
            }
            $result = $stdout.Result | ConvertFrom-Json
            if ($result.schema -cne 'easyeda-pro-control.pcb-diagnostic-synthetic-launch.v1' -or
                $result.easyedaLaunched -cne $false -or $result.productionFilesAccessed -cne $false -or
                $result.forcedTermination -cne $false -or @($result.results).Count -ne 1) {
              throw 'Synthetic scope proof failed.'
            }
            $proof = @($result.results)[0]
            if ($proof.Variant -cne 'shared-dos-suspended-native-image-verified' -or
                $proof.Created -cne $true -or $proof.CreatedImageVerified -cne $true -or
                $proof.PrimaryThreadResumed -cne $true -or $proof.OriginalRootExited -cne $true -or
                $proof.JobEmpty -cne $true -or $proof.Released -cne $true -or
                $proof.Error -ne 0 -or $proof.ExitCode -ne 0) {
              throw 'Original suspended-image, natural-exit or release proof failed.'
            }
          } finally { $child.Dispose() }
          Write-Output 'Exact shared launch core verified the suspended image, resumed once, observed natural exit and released its original handles. No EasyEDA launch.'
